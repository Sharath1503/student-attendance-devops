[defaults]
roles_path = roles
inventory = inventory.ini
# Host-key verification stays ON. Add the server once with:  ssh-keyscan -H <host> >> ~/.ssh/known_hosts
host_key_checking = True
retry_files_enabled = False
stdout_callback = default
result_format = yaml
interpreter_python = auto_silent
timeout = 30

[privilege_escalation]
become = True
become_method = sudo

[ssh_connection]
pipelining = True
