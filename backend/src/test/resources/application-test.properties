# Integration-test profile: in-memory H2 in MySQL-compatibility mode. Flyway still applies the real migrations.
# All values below are throw-away test constants, not real secrets.
spring.datasource.url=jdbc:h2:mem:attendance_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=true

app.jwt.secret=test-only-signing-key-test-only-signing-key-0123456789
app.jwt.expiration-minutes=5
app.security.bcrypt-strength=4
app.cors.allowed-origins=http://localhost:5173
app.attendance.edit-window-days=7
app.attendance.low-threshold-percent=75
app.bootstrap.admin-username=admin
app.bootstrap.admin-password=
app.seed.demo-enabled=false
app.seed.demo-password=

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
logging.level.com.attendance=WARN
