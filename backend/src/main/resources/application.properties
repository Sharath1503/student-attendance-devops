spring.application.name=student-attendance
server.port=${SERVER_PORT:8080}

# ---- Database (all values come from environment variables; no password default on purpose) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/attendance_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:attendance_app}
spring.datasource.password=${DB_PASSWORD}

# ---- JPA / Flyway ----
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---- JSON ----
spring.jackson.serialization.write-dates-as-timestamps=false

# ---- Safe error responses (no stack traces / internal messages leak to clients) ----
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# ---- Actuator: expose only health + info, never details ----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.liveness.include=livenessState
management.info.env.enabled=false

# ---- Swagger / OpenAPI ----
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}

# ---- Application settings ----
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.attendance.edit-window-days=${ATTENDANCE_EDIT_WINDOW_DAYS:7}
app.attendance.low-threshold-percent=${ATTENDANCE_LOW_THRESHOLD:75}
# First admin is created only when BOOTSTRAP_ADMIN_PASSWORD is provided (min 8 chars)
app.bootstrap.admin-username=${BOOTSTRAP_ADMIN_USERNAME:admin}
app.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}
# Optional demo data (1 faculty, 3 students, 2 courses, sample attendance)
app.seed.demo-enabled=${SEED_DEMO_DATA:false}
app.seed.demo-password=${SEED_DEMO_PASSWORD:}

logging.level.root=INFO
logging.level.com.attendance=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n
